name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "HajiraNotebook-AndroidStudio.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip project
        run: unzip -o HajiraNotebook-AndroidStudio.zip -d work

      - name: Build debug APK
        working-directory: work/HajiraNotebook
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hajira-notebook-apk
          path: work/HajiraNotebook/app/build/outputs/apk/debug/app-debug.apষ
