name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Repack and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p work/assets/www
          cp original.apk work/app.apk
          cp index.html work/assets/www/index.html
          cd work
          zip -q -d app.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          zip -q app.apk assets/www/index.html
          $BT/zipalign -p -f 4 app.apk aligned.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          $BT/apksigner sign --ks ks.jks --ks-pass pass:android --key-pass pass:android --out ../gaarir-hisab.apk aligned.apk
          $BT/apksigner verify -v ../gaarir-hisab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gaarir-hisab-apk
          path: gaarir-hisab.apk
