name: Build APK from ZIP

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP খুলে প্রজেক্ট ফোল্ডার খুঁজুন
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "রিপোজিটরির রুটে কোনো .zip ফাইল পাওয়া যায়নি"; exit 1; fi
          echo "ZIP: $ZIP"
          mkdir -p unzipped
          unzip -q -o "$ZIP" -d unzipped
          SETTINGS=$(find unzipped -name 'settings.gradle*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle পাওয়া যায়নি। ZIP-এর ভেতরের ফাইল:"
            find unzipped -maxdepth 3 | head -n 50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK বিল্ড
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GariHisab-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
